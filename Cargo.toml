[package]
name = "venture-os-kernel"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4", "serde"] }
thiserror = "1.0"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0"

[[bin]]
name = "restate-workers"
path = "src/bin/restate-workers.rs"
required-features = ["restate"]

[dev-dependencies]
futures = "0.3"
tokio = { version = "1.0", features = ["full"] }

[target.'cfg(feature = "restate")'.dependencies]
restate-sdk = { version = "0.2", optional = true }

[features]
default = []
restate = ["restate-sdk"]

[profile.release]
lto = true
strip = true
codegen-units = 1
opt-level = 3
